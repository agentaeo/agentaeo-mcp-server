name: Publish to MCP Registry

on:
  workflow_dispatch:  # Run manually from GitHub Actions tab
  push:
    tags:
      - 'v*'          # Also auto-runs on version tags

permissions:
  id-token: write   # Required for OIDC auth with MCP Registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP Registry
        run: mcp-publisher publish --token-source github-actions
